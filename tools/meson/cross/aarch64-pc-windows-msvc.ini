; Cross-file para informar libdir e host_machine,
; a mágica real está no vcvarsall.bat usado pelos scripts Python.

[constants]
triple = 'aarch64-pc-windows-msvc'

[binaries]
c = 'cl'
strip = 'dumpbin'

[built-in options]
libdir = 'lib' / triple
vsenv = false

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
