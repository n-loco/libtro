; Cross-file para build em CI.

[constants]
triple = 'x86_64-linux-gnu'

[binaries]
c = triple + '-gcc'
ar = triple + '-ar'
strip = triple + '-strip'

[built-in options]
libdir = 'lib' / 'x86_64-unknown-linux-gnu'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
